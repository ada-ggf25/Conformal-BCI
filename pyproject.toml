[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "ml-decoding"
version = "0.1.0"
description = "Uncertainty-Aware Machine Learning for Long-Term Neural Recordings in Flexible Brain–Computer Interfaces"
authors = [{name = "Guilherme Grancho", email = "guilherme.fernandes25@imperial.ac.uk"}]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pymongo>=4.0",
    "python-dotenv>=1.0",
    "paramiko>=5.0",
    "zstandard>=0.25.0",
    "torch>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=3.0",
    "papermill>=2.6",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
]

[project.urls]
Repository = "https://github.com/ada-ggf25/ML-Decoding"

# `pip install -e ".[dev]"` does not work.
# Use `uv sync`, or `pip install --group dev`.
[dependency-groups]

docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0",
]

dev = [
    "pytest>=9",
    "pymarkdownlnt>=0.9",
    "ruff>=0.15.17",
    "mypy>=2.0",
    "jupyterlab>=4.6.0",
    "statsmodels>=0.14",
    {include-group = "docs"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: live connection tests — skipped when MONGODB_URI is not set",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TC", "RUF", "FURB"]
extend-ignore = [
    "RUF012",  # noisy in test fixtures
    "RUF001",  # for mathematical notation
    "RUF002",  # for mathematical notation
    "RUF003",  # for mathematical notation
]

[tool.ruff.lint.per-file-ignores]
"analyses/**/*.ipynb" = ["E402"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
