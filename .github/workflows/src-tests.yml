name: src-tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'tests/data/**'
      - 'tests/utils/**'
      - 'tests/models/**'
      - 'tests/conformal/**'
      - 'tests/chain/**'
      - 'tests/analyses/**'
      - 'analyses/run_mazes.py'
      - 'tests/db/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/src-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  src-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python dependencies
        run: uv sync

      - name: Run src unit tests
        run: make src-test
